# LabMemory MCP 反向代理（Nginx）
#
# 部署：将本片段 include 到站点 server { } 块内（443 listener）；
#      Aily 出口 IP 段按飞书官方文档定期更新（详见 deploy/README.md）。

# === MCP SSE ===
# 必须在 http {} 段定义 upstream：
# upstream labmemory_backend {
#     server 127.0.0.1:8000;
#     keepalive 32;
# }

server {
    listen 443 ssl http2;
    server_name labmemory.example.com;

    # SSL 配置（省略）
    ssl_certificate     /etc/letsencrypt/live/labmemory.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labmemory.example.com/privkey.pem;

    # Aily 出口 IP 白名单（按飞书官方文档更新）
    # 203.166.190.0/24
    # 203.166.191.0/24

    location = /mcp/sse {
        # 仅放行 Aily 出口 IP
        allow 203.166.190.0/24;
        allow 203.166.191.0/24;
        deny all;

        proxy_pass http://labmemory_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;

        # SSE 必填：关闭缓冲 + 长读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # 关闭请求体缓冲（小 POST 流不影响）
        proxy_request_buffering off;

        # HTTP/1.1 长连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /mcp/messages {
        allow 203.166.190.0/24;
        allow 203.166.191.0/24;
        deny all;

        proxy_pass http://labmemory_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
    }

    location = /mcp/manifest {
        allow 203.166.190.0/24;
        allow 203.166.191.0/24;
        deny all;

        proxy_pass http://labmemory_backend;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # === 其它路由（/v1/* /api/* /）走原有配置，不在此文件中 ===
    # location / { ... }
}

# === Health check（可选） ===
# location /health {
#     allow all;  # 健康检查通常来自内网监控
#     deny all;
#     allow 10.0.0.0/8;
#     proxy_pass http://labmemory_backend;
# }